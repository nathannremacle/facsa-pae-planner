    window.dataPromise = fetch('../data/' + code + '.json', { cache: "no-cache" })
      .then(res => {
        if (!res.ok) throw new Error("HTTP error " + res.status);
        return res.json();
      });

<body>
  <div id="app" x-data="app">
    <template x-if="share.show">
      <div id="popup_container" x-data="{ noneSelected: (numSelected == 0), copyState: false }" @click="share.show = false">
        <div class="popup" @click.stop>
          <svg class="cross clickable" fill="currentColor" @click="share.show = false"><use href="../assets/icons.svg#x-mark"/></svg>
          <h4>Partage de l'horaire</h4>
          <div class="expl" x-text="noneSelected ?
            'Aucun cours sélectionné. Après avoir sélectionné un ensemble de cours, vous trouverez ici un lien vous permettant de partager votre sélection.' :
            'Voici un lien vous permettant d\'enregistrer votre sélection de cours et de la partager facilement :'">
          </div>
          <div class="link">
            <span x-show="noneSelected" x-text="share.prot + '//...'" class="disable"></span>
            <span x-show="!noneSelected" x-init="noneSelected || share.url || generateUrl()">
              <span x-show="share.loading" class="loading">génération du lien en cours...</span>
              <span x-show="!share.loading && share.url" x-text="share.url"></span>
              <span x-show="!share.loading && !share.url" class="error">-- échec de la génération du lien --</span>
            </span>
          </div>
          <div class="share_icons" :class="{ disable: (numSelected == 0) || share.loading || !share.url }">
            <div class="clickable" :style="{'pointer-events': copyState ? 'none' : 'default'}" @click="copyUrl">
              <svg fill="currentColor"><use href="../assets/icons.svg#paper-clip"/></svg>
              <span x-text="copyState ? (copyState == 'copied' ? 'Copié !' : 'Erreur !') : 'Copier le lien'"></span>
            </div>
            <div class="clickable" @click="sendEmail">
              <svg fill="currentColor"><use href="../assets/icons.svg#envelope"/></svg>
              <span>Envoyer par email</span>
            </div>
            <div class="clickable" @click="window.print()">
              <svg fill="currentColor"><use href="../assets/icons.svg#printer"/></svg>
              <span>Imprimer / PDF</span>
            </div>
          </div>
        </div>
      </div>
    </template>
    <div id="root" :class="{ ok: showAgenda }">
    <template x-if="error"><span x-text="error"></span></template>
    <template x-if="!error && layout.content">
    <div id="check">
      <h3 class="super" x-html="addBlocks(layout.h1)"></h3>
      <span class="actions">
        <button class="alt" @click="resetSelection();window.location.hash=''" title="cliquez ici pour effacer la sélection">
          <svg fill="currentColor"><use href="../assets/icons.svg#trash"/></svg><span>Tout effacer</span>
        </button>
        <button @click="share.show = true" title="cliquez ici pour générer un lien de partage">
          <svg fill="currentColor"><use href="../assets/icons.svg#arrow-up-on-square"/></svg><span>Partager</span>
        </button>
      </span>
      <template  x-for="opt in layout.content">
      <div class="option">
        <h4 x-text="opt.h2"></h4>
        <template x-for="bloc in opt.content">
        <div class="bloc">
          <h5 x-text="bloc.h3"></h5>
          <table>
            <template x-for="longcode in bloc.list">
            <tr x-id="['check']" x-data="{ shortcode: longcode.substring(0,10), c: courses[longcode.substring(0,10)][longcode] }" :class="{ bad: selected[shortcode], unsafe: conflict[shortcode].some(it => selected[it]) }">
              <td class="checkbox"><input :id="$id('check')" @input="updateAgenda" :disabled="loading" x-model="selected[shortcode]" :value="shortcode" type="checkbox"/></td>
              <td class="code"><label :for="$id('check')" x-text="longcode"></label></td>
              <td class="title"><label :for="$id('check')" x-text="c.title"></label></td>
              <td class="quadri"><label :for="$id('check')" x-text="c.quadri ? 'Q'+c.quadri : ''"></label></td>
              <td class="ects"><label :for="$id('check')" x-text="c.ects"></label></td>
            </tr>
            </template>
          </table>
        </div>
        </template>
      </div>
      </template>
    </div>
    </template>
    <div id="footer">
      <div id="band">
        <div class="mid">
          <span id="n" x-text="numSelectedStr">Aucun cours sélectionné</span>
          <span id="cr">
            <span x-show="ects[1] || ects[2]" x-cloak><span class="num" x-text="ects[1]"></span><span class="q">(Q1)</span> + <span class="num" x-text="ects[2]"></span><span class="q">(Q2)</span> = </span>
            <span class="num" x-text="ects[1] + ects[2]">0</span> crédits
          </span>
          <div id="b" class="actions">
            <button id="voir" @click="toggleAgenda" :title="showAgenda ? 'Cliquez ici pour retourner à la liste des cours' : 'Cliquez ici pour afficher l\'horaire'">
              <svg fill="currentColor" x-show="!showAgenda"><use href="../assets/icons.svg#calendar-days"/></svg>
              <svg fill="currentColor" x-show="showAgenda" x-cloak><use href="../assets/icons.svg#list-bullet"/></svg>
              <span x-text="showAgenda ? 'Choisir les cours' : 'Voir l\'horaire'">Voir l'horaire</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div id="agenda">
      <div id="hor">
        <div class="actions">
          <button @click="share.show = true" title="cliquez ici pour générer un lien de partage">
            <svg fill="currentColor"><use href="../assets/icons.svg#arrow-up-on-square"/></svg><span>Partager</span>
          </button>
        </div>
        <template x-for="q in 2">
        <div class="page">
          <div class="table" :class="{empty: !agenda[q].some(it => it.length)}">
            <h4 class="quadri" x-text="'Q'+q"></h4>
            <div class="apm">AM</div>
            <div class="apm">PM</div>
            <template x-for="d in [0,1,2,3,4]">
              <div class="day" :class="{empty: !agenda[q][d].length}">
                <h5 x-text="['Lundi','Mardi','Mercredi','Jeudi','Vendredi'][d]"></h5>
                <div class="halfdays">
                <template x-for="apm in ['AM','PM']">
                  <div class="halfday">
                    <template x-for="c in agenda[q][d].filter(it => (it.slot.start.h < 12) == (apm == 'AM'))">
                      <div class="event" :class="{ bad: c.conflict }">
                        <div class="time" x-text="slotStr(c.slot)"></div>
                        <div class="w_title"><span class="code" x-text="c.course.code"></span><span class="title" x-text="c.course.title"></span></div>
                        <div class="prof" x-text="c.course.prof"></div>
                      </div>
                    </template>
                  </div>
                </template>
                </div>
              </div>
            </template>  
          </div>
          <div class="cr_print" x-text="`crédits Q${q} : ${ects[q]} / ${ects[1]+ects[2]}`"></div>
        </div>
        </template>
      </div>
    </div>
  </div>
  </div>
  <script type="module">
    import { default as Alpine } from 'https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/+esm';

    Alpine.data('app', () => ({
      error: null,
      showAgenda: false,
      layout: {},
      courses: {},
      selected: {},
      conflict: {},
      agenda: emptyAgenda(),
      ects: [null, 0, 0],
      loading: !!window.location.hash,
      share: { show: false, prot: window.location.protocol, loading: true, url: '' },

      get numSelected() {
        return Object.values(this.selected).reduce((a, item) => a + item, 0);
      },
      get listOfSelected() {
        return Object.keys(this.selected).filter(k => this.selected[k]);
      },
      get numSelectedStr() {
        let count = this.numSelected;
        if (count == 0)
          return 'Aucun cours sélectionné';
        else if (count == 1)
          return '1 cours sélectionné';
        else
          return count + ' cours sélectionnés';
      },
      
      addBlocks(text) {
        return text.split(' - ').map(c => '<span>' + c +'</span>').join(' - ');
      },
      resetSelection() {
        this.selected = {};
        this.agenda = emptyAgenda();
      },
      updateEcts() {
        let acc = [null, 0, 0];
        for (const [ shortCode, isSelected ] of Object.entries(this.selected)) {
          if (!isSelected) continue;
          for (const [ longCode, course ] of Object.entries(this.courses[shortCode])) {
            let ects = (course.ects || 0);
            acc[course.quadri] += ects;
            if (longCode.length > 10) {
              acc[1] -= ects / 2;
              acc[2] -= ects / 2;
            }
          }
        }
        this.ects = acc;
      },
      toggleAgenda() {
        this.showAgenda = !this.showAgenda;
        window.scrollTo(0, 0);
      },
      updateAgenda(event) {
        this.share.url = '';
        let checked = event.target.checked;
        let code = event.target.value;
        let list = this.courses[code];
        Object.values(list).forEach(course => {
          Object.values(course.slots).forEach(slot => {
            if (checked) this.insert(course, slot);
            else this.remove(course, slot);
          });
        });
      },
      insert(course, slot) {
        let list = this.agenda[course.quadri][slot.day];
        let elem = { course: course, slot: slot, confict: false };
        let i = 0;
        while (i < list.length && timeLessThan(list[i].slot.start, slot.start)) i++;
        list.splice(i, 0, elem);
        if (elem.slot.check)
          this.updateConflicts(list);
      },
      remove(course, slot) {
        let list = this.agenda[course.quadri][slot.day];
        let i = 0;
        let any_check = false;
        while (i < list.length) {
          if (list[i].course.code.substring(0,10) == course.code.substring(0,10)) {
            if (list[i].conflict) any_check = true;
            list.splice(i, 1);
          }
          else i++;
        }
        if (any_check)
          this.updateConflicts(list);
      },
      updateConflicts(list) {
        for (let fst = 0; fst < list.length; fst++) list[fst].conflict = false;
        for (let snd = 0; snd < list.length; snd++) {
          if (!list[snd].slot.check) continue;
          for (let fst = 0; fst < snd; fst++) {
            if (!list[fst].slot.check) continue;
            if (!timeLessThan(list[fst].slot.end, list[snd].slot.start)) {
              list[fst].conflict = true;
              list[snd].conflict = true;
            }  
          }
        }
      },
      slotStr(slot) {
        return timetoString(slot.start) + ' - ' + timetoString(slot.end);
      },
      sendEmail() {
        let subject = this.layout.h1;
        let body = writeEmail(this.courses, this.listOfSelected, this.share.url);
        let uri = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
        window.open(uri);
      },
      async loadFragment() {
        const hash = window.location.hash;
        if (!hash.startsWith('#b=')) return;
        const data = hash.substring(3).split('=')[0];
        let decoder, selected;
        try {
          decoder = await import('../js/decoder.min.js');
        }
        catch (e) {
          console.error(e);
          alert("Une erreur est survenue lors du chargement de l'horaire. Veuillez réessayer plus tard.");
          return;
        }
        try {
          selected = decoder.decode(data);
        }
        catch (e) {
          console.error(e);
          alert("Une erreur est survenue lors du chargement de l'horaire. L'URL semble être invalide.");
          return;
        }
        for (const code of selected) {
          if (!(code in this.courses)) {
            alert("Impossible de charger l'horaire. Le cours '" + code + "' n'existe pas.");
            this.resetSelection();
            return;
          }
          this.selected[code] = true;
          this.updateAgenda({target: {value: code, checked: true}});
        }
        this.showAgenda = true;
      },
      async generateUrl() {
        this.share.loading = true;
        try {
          const encoder = await import('../js/encoder.min.js');
          const data = encoder.encode(this.listOfSelected);
          this.share.url = this.share.prot + '//' + window.location.hostname + window.location.pathname + '#b=' + data;
        }
        catch (err) {
          console.error(err);
          this.share.url = '';
        }
        this.share.loading = false;
      },
      async copyUrl() {
        let url = this.share.url;
        try {
          await navigator.clipboard.writeText(url);
          this.copyState = 'copied';
        } catch (error) {
          this.copyState = 'fail';
        }
        setTimeout(() => {this.copyState = false}, 1000);
      },
      async init() {
        try {
          let json = await window.dataPromise;
          this.courses = json.courses;
          this.conflict = computeAllConflicts(json.courses);
          this.layout = json.layout;
        }
        catch (err) {
          console.error(err);
          this.error = 'Une erreur est survenue.';
        }
        this.$watch('selected', () => this.updateEcts());
        await this.loadFragment();
        this.loading = false;
        window.onhashchange = (async () => {
          this.loading = true;
          this.resetSelection();
          this.showAgenda = false;
          this.share.show = false;
          await this.loadFragment();
          this.loading = false;
        });
      },

    }));
    Alpine.start();

    function computeAllConflicts(courses) {
      let allStart = emptyAgenda(), allEnd = emptyAgenda();
      let conflict = {};
      for (const [code, list] of Object.entries(courses)) {
        for (const course of Object.values(list)) {
          course.slots.filter(s => s.check).forEach((s, idx) => {
            allStart[course.quadri][s.day].push({ code: code, val: timeToInt(s.start) });
            allEnd[course.quadri][s.day].push({ code: code, val: timeToInt(s.end) });
          });
        }
        conflict[code] = new Set();
      }
      for (let q = 1; q <= 2; q++) {
        for (let d = 0; d < 5; d++) {
          let start = allStart[q][d], end = allEnd[q][d];
          start.sort((a, b) => (a.val - b.val));
          end.sort((a, b) => (a.val - b.val));
          let open = new Map();
          let s = 0, e = 0;
          while (s < start.length) {
            if (e < end.length && end[e].val <= start[s].val) {
              let code = end[e].code;
              let count = open.get(code);
              if (count == 1) open.delete(code);
              else open.set(code, count - 1);
              e++;
            }
            else {
              let code = start[s].code;
              for (const openCode of open.keys()) {                
                if (code == openCode) continue;
                conflict[code].add(openCode);
                conflict[openCode].add(code);
              }
              let count = open.get(code);
              if (!count) open.set(code, 1);
              else open.set(code, count + 1);
              s++;
            }
          }
        }
      }
      Object.entries(conflict).forEach(([k, v]) => conflict[k] = [...v]);
      return conflict;
    }
    function emptyAgenda() {
      return [null, [[],[],[],[],[],[],[]], [[],[],[],[],[],[],[]]];
    }
    function timetoString(t) {
      return t.h.toString().padStart(2,'0') + 'h' + t.m.toString().padStart(2,'0');
    }
    function timeToInt(t) {
      return t.h * 60 + t.m;
    }
    function timeLessThan(t1, t2) {
      return timeToInt(t1) <= timeToInt(t2);
    }
    function writeEmail(courses, selected, url) {
      const withLong = selected.sort().map(c => Object.values(courses[c])).flat();
      const listQuadri = (q) => withLong.filter(c => c.quadri == q).map(c => `- ${c.code.substring(0,10)} : ${c.title}`).join('\n');
      const body =
`Bonjour,

Je partage avec vous une sélection de cours élaborée grâce à l'outil interactif de la Faculté des Sciences Appliquées.

Liste des cours du Q1 :
${ listQuadri(1) || ' - vide' }

Liste des cours du Q2 :
${ listQuadri(2) || ' - vide' }

Vous pouvez consulter cette proposition et apporter vos propres ajustements avec le lien suivant : ${ url }

Cordialement,


-- Cet email a été généré automatiquement par l'outil interactif.
`
      return body;
    }
  </script>
